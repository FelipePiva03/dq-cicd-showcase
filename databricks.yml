# =============================================================================
# Databricks Asset Bundle — dq-cicd-showcase
# =============================================================================
# Streaming Medallion pipeline with embedded Data Quality gates (GX + Soda).
# Two targets: dev (default, personal workspace) and prod (CI-deployed).
# =============================================================================

bundle:
  name: dq-cicd-showcase

include:
  - resources/jobs/*.yml

variables:
  catalog:
    description: Unity Catalog name (overridden per target)
    default: dq_showcase
  notifications_email:
    description: Email for job failure notifications
    default: felipepiva02@gmail.com

# NOTE: workspace.host is intentionally NOT set per target — DABs forbids
# variable interpolation in auth fields. Both targets pick it up from the
# DATABRICKS_HOST env var (set locally via .env, in CI via GitHub Secrets).

targets:

  # ---------------------------------------------------------------------------
  # DEV — used for local development and PR validation deploys
  # ---------------------------------------------------------------------------
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dq_showcase_dev
    # In `development` mode, DABs auto-prefixes resource names with the user
    # and disables schedules — perfect for safe iteration.

  # ---------------------------------------------------------------------------
  # PROD — deployed only from main branch via GitHub Actions
  # ---------------------------------------------------------------------------
  prod:
    mode: production
    workspace:
      root_path: /Workspace/dq-cicd-showcase/prod
    variables:
      catalog: dq_showcase_prod
    run_as:
      # On Free Edition we run as the workspace user; in real prod, swap to SP:
      # service_principal_name: ${var.sp_name}
      user_name: ${workspace.current_user.userName}

