name: Deploy → dev

on:
  push:
    branches: [develop]

# Don't deploy the same target twice in parallel
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy bundle to dev workspace
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main

      - name: Validate
        run: databricks bundle validate --target dev

      - name: Deploy
        run: databricks bundle deploy --target dev

      # No smoke task here intentionally: running run_all on every develop push
      # is ~10 min on serverless and not the right gate for a deploy workflow.
      # The bundle is validated (above) and the artifacts are uploaded to dev —
      # operators trigger run_all manually when they want an E2E smoke. The
      # actual code gates live in `ci.yml` (lint + unit + integration).

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
