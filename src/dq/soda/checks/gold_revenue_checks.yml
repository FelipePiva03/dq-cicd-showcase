# =============================================================================
# Soda Core checks — gold marts (daily_orders + delivery_performance)
# =============================================================================
# Business-level invariants protecting downstream BI consumers. Run by the
# `soda_validation_gold` task in resources/jobs/gold_aggregations.yml, which
# refreshes both marts immediately before this scan.
#
# Severity convention (Soda-native, matches silver_dims_checks.yml):
#   - bare check (no `warn:`)        → fails the scan, exits 1
#   - check with `warn: when ...`    → warning only, scan still passes
# =============================================================================

# ----- gold.daily_orders ------------------------------------------------------
checks for daily_orders:
  - row_count > 0:
      name: at least one daily aggregation must exist
  - missing_count(order_date) = 0:
      name: order_date must never be null
  - invalid_count(order_count) = 0:
      name: order_count must be non-negative
      valid min: 0
  - duplicate_count(order_date, order_status) = 0:
      name: (order_date, order_status) must be the natural key

# ----- gold.delivery_performance ----------------------------------------------
checks for delivery_performance:
  - row_count > 0:
      name: at least one weekly aggregation must exist
  - missing_count(week_start) = 0:
      name: week_start must never be null
  - duplicate_count(week_start) = 0:
      name: week_start is the natural key — one row per week
  - invalid_count(delivered_orders) = 0:
      name: delivered_orders must be non-negative
      valid min: 0
  - invalid_percent(avg_days_to_delivery) < 1:
      name: avg delivery within 0..90 days for >=99% of weeks
      valid min: 0
      valid max: 90
      warn: when > 0
  - invalid_percent(p95_days_to_delivery) < 1:
      name: p95 delivery within 0..120 days for >=99% of weeks
      valid min: 0
      valid max: 120
      warn: when > 0
