# =============================================================================
# Soda Core checks — silver dimensions (5 dims in one file)
# =============================================================================
# Runs after batch_dimensions has refreshed every silver.dim_*. Validates
# business semantics on top of what HARD_RULES quarantine already removed.
#
# Severity convention (Soda-native):
#   - bare check (no `warn:`)        → fails the scan, exits 1, blocks downstream
#   - check with `warn: when ...`    → warning only, scan still passes
# Mirrors the critical-vs-warning split used by the GX gate on silver facts.
# =============================================================================

# ----- dim_customer -----------------------------------------------------------
checks for dim_customer:
  - duplicate_count(customer_id) = 0:
      name: customer_id must be unique post-MERGE
  - row_count > 0:
      name: dim_customer cannot be empty
  - invalid_count(customer_state) = 0:
      name: customer_state must be a valid Brazilian state code
      valid values: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
      warn: when > 0

# ----- dim_product ------------------------------------------------------------
checks for dim_product:
  - duplicate_count(product_id) = 0:
      name: product_id must be unique post-MERGE
  - row_count > 0:
      name: dim_product cannot be empty
  - missing_count(product_category_name) < 1000:
      name: most products must have a category
      warn: when > 0    # any uncategorized is a warning, big spike fails
  - invalid_percent(product_weight_g) < 1:
      name: product_weight_g must be 1g..100kg for >=99% of products
      valid min: 1
      valid max: 100000
      warn: when > 0

# ----- dim_seller -------------------------------------------------------------
checks for dim_seller:
  - duplicate_count(seller_id) = 0:
      name: seller_id must be unique post-MERGE
  - row_count > 0:
      name: dim_seller cannot be empty
  - invalid_count(seller_state) = 0:
      name: seller_state must be a valid Brazilian state code
      valid values: [AC, AL, AM, AP, BA, CE, DF, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
      warn: when > 0

# ----- dim_geolocation --------------------------------------------------------
checks for dim_geolocation:
  - duplicate_count(geolocation_zip_code_prefix) = 0:
      name: zip prefix must be unique (collapsed by groupBy in silver)
  - row_count > 0:
      name: dim_geolocation cannot be empty
  - invalid_percent(geolocation_lat) < 1:
      name: lat must be inside Brazil bounding box for >=99% of zips
      valid min: -34
      valid max: 5
      warn: when > 0
  - invalid_percent(geolocation_lng) < 1:
      name: lng must be inside Brazil bounding box for >=99% of zips
      valid min: -75
      valid max: -33
      warn: when > 0

# ----- dim_category -----------------------------------------------------------
checks for dim_category:
  - duplicate_count(product_category_name) = 0:
      name: category name must be unique (it's the PK)
  - missing_count(product_category_name_english) = 0:
      name: english translation required — gold marts use it for display
  - row_count between 50 and 200:
      name: Olist has ~71 categories; outside [50,200] suggests source drift
