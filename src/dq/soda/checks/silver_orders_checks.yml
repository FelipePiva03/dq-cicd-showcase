# =============================================================================
# Soda Core checks — silver.orders
# =============================================================================
# These are the SAME logical checks as the GX suite at
# src/dq/great_expectations/expectations/silver_orders_suite.json
# Use this for side-by-side comparison in docs/COMPARISON.md.
# =============================================================================

checks for silver_orders:

  # ---- completeness -----------------------------------------------------------
  - missing_count(order_id) = 0:
      name: order_id must never be null
  - missing_count(customer_id) = 0:
      name: customer_id must never be null

  # ---- uniqueness -------------------------------------------------------------
  - duplicate_count(order_id) = 0:
      name: order_id must be unique

  # ---- validity (allowed values) ---------------------------------------------
  - invalid_count(order_status) = 0:
      name: order_status must be in canonical set
      valid values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]

  # ---- validity (numeric range) ----------------------------------------------
  - invalid_percent(days_to_delivery) < 1:
      name: days_to_delivery must be in 0..90 for >=99% of rows
      valid min: 0
      valid max: 90

  # ---- consistency (cross-column) --------------------------------------------
  - failed rows:
      name: delivery date must be on or after purchase date
      fail query: |
        SELECT order_id, order_purchase_timestamp, order_delivered_customer_date
        FROM silver_orders
        WHERE order_delivered_customer_date IS NOT NULL
          AND order_delivered_customer_date < order_purchase_timestamp

  # ---- freshness / volume ----------------------------------------------------
  - row_count between 1 and 1000000:
      name: row count plausibility
