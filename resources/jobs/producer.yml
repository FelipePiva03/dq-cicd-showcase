# =============================================================================
# Producer Job — temporal replay of Olist event tables
# =============================================================================
# Reads orders/items/payments/reviews from /Volumes/.../source/raw and drops
# them into /Volumes/.../landing/events/{table}/batch_NNNN/ bucketed by each
# row's effective timestamp. Auto Loader (streaming_events job) picks them
# up from there.
#
# Runs on-demand only — this is "seed data" for dev/qa, not a recurring job.
# In real production you'd swap this out for a CDC connector or a Kafka tap.
# =============================================================================

resources:
  jobs:
    producer_events:
      name: "[${bundle.target}] Producer — Olist event replay"

      email_notifications:
        on_failure:
          - ${var.notifications_email}

      tasks:
        - task_key: replay_olist_events
          job_cluster_key: shared_cluster
          spark_python_task:
            python_file: ../../src/pipelines/producer/replay_olist.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--window-days"
              - "7"

      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2   # Azure SKU; swap for AWS if needed
            num_workers: 1
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
