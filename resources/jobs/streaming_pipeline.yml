# =============================================================================
# Streaming Pipeline Job — Bronze → Silver → Gold with DQ gates
# =============================================================================
# Orchestration:
#
#   bronze_orders ─────► silver_orders ─────► gold_revenue
#                            │                     │
#                            ▼                     ▼
#                       gx_validation        soda_validation
#                       (gate task)          (gate task)
#
# Each DQ task is a separate task with a `depends_on` block, so a failure
# stops downstream and is visible in the run timeline. Continuous streaming
# is configured via `continuous` block at the job level.
# =============================================================================

resources:
  jobs:
    streaming_pipeline:
      name: "[${bundle.target}] Olist Streaming Pipeline"

      email_notifications:
        on_failure:
          - ${var.notifications_email}

      # Streaming — keep tasks alive; Databricks will restart on failure
      continuous:
        pause_status: UNPAUSED

      tasks:
        # ---------------------------------------------------------------------
        # BRONZE: Auto Loader from landing volume to bronze.orders
        # ---------------------------------------------------------------------
        - task_key: bronze_orders
          job_cluster_key: shared_cluster
          spark_python_task:
            python_file: ../../src/pipelines/bronze/ingest_orders.py
            parameters:
              - "--catalog"
              - "${var.catalog}"

        # ---------------------------------------------------------------------
        # SILVER: streaming transform with foreachBatch + MERGE
        # ---------------------------------------------------------------------
        - task_key: silver_orders
          depends_on:
            - task_key: bronze_orders
          job_cluster_key: shared_cluster
          spark_python_task:
            python_file: ../../src/pipelines/silver/transform_orders.py
            parameters:
              - "--catalog"
              - "${var.catalog}"

        # ---------------------------------------------------------------------
        # DQ GATE 1: Great Expectations on silver.orders
        # Fails the run if expectation suite below threshold
        # ---------------------------------------------------------------------
        - task_key: gx_validation_silver
          depends_on:
            - task_key: silver_orders
          job_cluster_key: shared_cluster
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--checkpoint"
              - "silver_orders_checkpoint"

        # ---------------------------------------------------------------------
        # GOLD: windowed aggregations
        # ---------------------------------------------------------------------
        - task_key: gold_revenue
          depends_on:
            - task_key: gx_validation_silver
          job_cluster_key: shared_cluster
          spark_python_task:
            python_file: ../../src/pipelines/gold/aggregate_revenue.py
            parameters:
              - "--catalog"
              - "${var.catalog}"

        # ---------------------------------------------------------------------
        # DQ GATE 2: Soda Core on gold.daily_revenue
        # ---------------------------------------------------------------------
        - task_key: soda_validation_gold
          depends_on:
            - task_key: gold_revenue
          job_cluster_key: shared_cluster
          spark_python_task:
            python_file: ../../src/dq/soda/run_scan.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--checks-file"
              - "gold_revenue_checks.yml"

      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"
              spark.sql.streaming.schemaInference: "true"
