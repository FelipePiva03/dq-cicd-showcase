# =============================================================================
# batch_dimensions — Bronze + Silver SCD1 + GX gate for the 5 dim tables
# =============================================================================
# Topology (15 tasks, 5 parallel chains):
#
#     bronze_dim_customer    ─→ silver_dim_customer    ─→ gx_validation_dim_customer
#     bronze_dim_product     ─→ silver_dim_product     ─→ gx_validation_dim_product
#     bronze_dim_seller      ─→ silver_dim_seller      ─→ gx_validation_dim_seller
#     bronze_dim_geolocation ─→ silver_dim_geolocation ─→ gx_validation_dim_geolocation
#     bronze_dim_category    ─→ silver_dim_category    ─→ gx_validation_dim_category
#
# Cadence: daily 04:00 America/Sao_Paulo (auto-paused in dev by DABs
# `mode: development`). Dims are slow-changing master data.
#
# DQ: GX gate per dim (one task per contract). Soda was tried first but
# failed on Databricks serverless (see run_checkpoint.py docstring).
#
# Compute: serverless (`client: "2"`).
# =============================================================================

resources:
  jobs:
    batch_dimensions:
      name: "[${bundle.target}] Batch dimensions — Bronze + Silver + GX"

      email_notifications:
        on_failure:
          - ${var.notifications_email}

      schedule:
        quartz_cron_expression: "0 0 4 * * ?"   # daily 04:00 (prod only)
        timezone_id: "America/Sao_Paulo"

      tasks:
        # ----- BRONZE: 5 parallel batch loads --------------------------------
        - task_key: bronze_dim_customer
          spark_python_task:
            python_file: ../../src/pipelines/bronze/load_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "customer"]
          environment_key: default

        - task_key: bronze_dim_product
          spark_python_task:
            python_file: ../../src/pipelines/bronze/load_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "product"]
          environment_key: default

        - task_key: bronze_dim_seller
          spark_python_task:
            python_file: ../../src/pipelines/bronze/load_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "seller"]
          environment_key: default

        - task_key: bronze_dim_geolocation
          spark_python_task:
            python_file: ../../src/pipelines/bronze/load_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "geolocation"]
          environment_key: default

        - task_key: bronze_dim_category
          spark_python_task:
            python_file: ../../src/pipelines/bronze/load_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "category"]
          environment_key: default

        # ----- SILVER: SCD1 MERGE, each depends on its bronze ----------------
        - task_key: silver_dim_customer
          depends_on: [{ task_key: bronze_dim_customer }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "customer"]
          environment_key: default

        - task_key: silver_dim_product
          depends_on: [{ task_key: bronze_dim_product }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "product"]
          environment_key: default

        - task_key: silver_dim_seller
          depends_on: [{ task_key: bronze_dim_seller }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "seller"]
          environment_key: default

        - task_key: silver_dim_geolocation
          depends_on: [{ task_key: bronze_dim_geolocation }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "geolocation"]
          environment_key: default

        - task_key: silver_dim_category
          depends_on: [{ task_key: bronze_dim_category }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "category"]
          environment_key: default

        # ----- GX GATE: one task per dim contract -----------------------------
        - task_key: gx_validation_dim_customer
          depends_on: [{ task_key: silver_dim_customer }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "dim_customer"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_dim_product
          depends_on: [{ task_key: silver_dim_product }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "dim_product"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_dim_seller
          depends_on: [{ task_key: silver_dim_seller }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "dim_seller"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_dim_geolocation
          depends_on: [{ task_key: silver_dim_geolocation }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "dim_geolocation"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_dim_category
          depends_on: [{ task_key: silver_dim_category }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "dim_category"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies: []

        - environment_key: gx
          spec:
            client: "2"
            dependencies:
              - great-expectations==1.5.6
