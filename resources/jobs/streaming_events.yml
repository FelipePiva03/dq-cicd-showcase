# =============================================================================
# streaming_events — Bronze + Silver + GX gate for the 4 event fact tables
# =============================================================================
# Consumes producer output from /Volumes/.../landing/events/{table}/ and
# materializes bronze.{table} → silver.fact_{table} → GX validation in 4
# parallel chains.
#
# Topology (12 tasks total):
#
#     bronze_orders         ─→ silver_orders         ─→ gx_validation_orders
#     bronze_order_items    ─→ silver_order_items    ─→ gx_validation_order_items
#     bronze_order_payments ─→ silver_order_payments ─→ gx_validation_order_payments
#     bronze_order_reviews  ─→ silver_order_reviews  ─→ gx_validation_order_reviews
#
# All 4 chains run in parallel; within each chain a stage starts only after
# the previous stage's task succeeds (explicit `depends_on`).
#
# GX gate uses tiered severity: a critical expectation failure exits 1 and
# blocks the chain; a warning failure logs + persists results and continues.
# See src/dq/great_expectations/run_checkpoint.py and the per-table suites.
#
# Compute: serverless (Free Edition only allows serverless; also the right
# default — each task is short-lived, no need to pay for cluster spin-up).
# Two environments:
#   - `default`   for bronze + silver (no extra deps)
#   - `gx`        for the 4 GX validation tasks (installs great-expectations)
# Splitting keeps bronze/silver task startup lean.
#
# Schedule: every 5 minutes (production mode); auto-paused in dev by DABs
# `mode: development` (pause_status omitted intentionally).
# =============================================================================

resources:
  jobs:
    streaming_events:
      name: "[${bundle.target}] Streaming events — Bronze + Silver + GX"

      email_notifications:
        on_failure:
          - ${var.notifications_email}

      schedule:
        quartz_cron_expression: "0 */5 * * * ?"   # every 5 min (prod only)
        timezone_id: "America/Sao_Paulo"

      tasks:
        # ----- BRONZE: 4 parallel Auto Loader tasks ---------------------------
        - task_key: bronze_orders
          spark_python_task:
            python_file: ../../src/pipelines/bronze/ingest_events.py
            parameters: ["--catalog", "${var.catalog}", "--table", "orders"]
          environment_key: default

        - task_key: bronze_order_items
          spark_python_task:
            python_file: ../../src/pipelines/bronze/ingest_events.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_items"]
          environment_key: default

        - task_key: bronze_order_payments
          spark_python_task:
            python_file: ../../src/pipelines/bronze/ingest_events.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_payments"]
          environment_key: default

        - task_key: bronze_order_reviews
          spark_python_task:
            python_file: ../../src/pipelines/bronze/ingest_events.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_reviews"]
          environment_key: default

        # ----- SILVER: 4 MERGEs, each depends on its bronze --------------------
        - task_key: silver_orders
          depends_on: [{ task_key: bronze_orders }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_fact.py
            parameters: ["--catalog", "${var.catalog}", "--table", "orders"]
          environment_key: default

        - task_key: silver_order_items
          depends_on: [{ task_key: bronze_order_items }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_fact.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_items"]
          environment_key: default

        - task_key: silver_order_payments
          depends_on: [{ task_key: bronze_order_payments }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_fact.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_payments"]
          environment_key: default

        - task_key: silver_order_reviews
          depends_on: [{ task_key: bronze_order_reviews }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_fact.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_reviews"]
          environment_key: default

        # ----- GX GATE: 4 validations, each depends on its silver --------------
        - task_key: gx_validation_orders
          depends_on: [{ task_key: silver_orders }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "fact_orders"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_order_items
          depends_on: [{ task_key: silver_order_items }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "fact_order_items"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_order_payments
          depends_on: [{ task_key: silver_order_payments }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "fact_order_payments"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_order_reviews
          depends_on: [{ task_key: silver_order_reviews }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "fact_order_reviews"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies: []

        - environment_key: gx
          spec:
            client: "2"
            dependencies:
              - great-expectations==1.5.6
