# =============================================================================
# gold_aggregations — Silver→Gold marts + GX gate (one task per mart)
# =============================================================================
# Topology (3 tasks):
#
#     gold_aggregate_revenue ─→ gx_validation_daily_orders
#                            └→ gx_validation_delivery_performance
#
# Cadence: nightly 05:00 America/Sao_Paulo.
#
# DQ: GX gate per mart, driven by the same generalized run_checkpoint.py
# script used for silver facts and dims.
# =============================================================================

resources:
  jobs:
    gold_aggregations:
      name: "[${bundle.target}] Gold aggregations — Silver→Gold + GX gates"

      email_notifications:
        on_failure:
          - ${var.notifications_email}

      schedule:
        quartz_cron_expression: "0 0 5 * * ?"   # daily 05:00 (prod only)
        timezone_id: "America/Sao_Paulo"

      tasks:
        # ----- AGGREGATION: silver.fact_orders → 2 gold marts ---------------
        - task_key: gold_aggregate_revenue
          spark_python_task:
            python_file: ../../src/pipelines/gold/aggregate_revenue.py
            parameters: ["--catalog", "${var.catalog}"]
          environment_key: default

        # ----- GX GATES: one task per mart ----------------------------------
        - task_key: gx_validation_daily_orders
          depends_on: [{ task_key: gold_aggregate_revenue }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "gold"
              - "--table"
              - "daily_orders"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_delivery_performance
          depends_on: [{ task_key: gold_aggregate_revenue }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "gold"
              - "--table"
              - "delivery_performance"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies: []

        - environment_key: gx
          spec:
            client: "2"
            dependencies:
              - great-expectations==1.5.6
