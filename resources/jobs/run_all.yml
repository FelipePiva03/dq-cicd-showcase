# =============================================================================
# run_all — flat end-to-end orchestrator (demo / smoke-test)
# =============================================================================
# Every step of the medallion shown explicitly as a separate task — 31 tasks
# in one DAG so the Workflows UI lineage is the whole story of the pipeline.
# No `run_job_task` wrapping; nothing hidden inside other jobs.
#
# Producer is idempotent: replay_olist.py short-circuits when the landing
# volume is already populated for every requested table (sub-minute existence
# check via `binaryFile` metadata). First run seeds ~5 min; subsequent
# run_all invocations pay the existence check only. Pass `--force` to
# re-replay from scratch.
#
# Topology:
#
#                         ┌────────────────────┐
#                         │ producer_replay    │  (idempotent — sub-minute
#                         └──────────┬─────────┘   when already seeded)
#                                    │
#         ┌──────────────────────────┴───────────────────────────┐
#         │ (event chains)                            (dim chains, independent)
#         ▼                                                       ▼
#   bronze_orders / items / payments / reviews     bronze_dim_*  (5 parallel,
#         ▼                                                       │ read from
#   silver_fact_orders / items / payments / reviews                │ source/raw)
#         ▼                                                       │
#   gx_validation_fact_*  (4, tiered crit/warn)    silver_dim_*  (5 parallel)
#                                                                ▼
#                                                  gx_validation_dim_*  (5)
#         │                                                       │
#         └──────────────┬───────────────────────────────────────┘
#                        ▼
#               gold_aggregate_revenue
#                        ▼
#       gx_validation_daily_orders + gx_validation_delivery_performance
#
# Not scheduled. Manual trigger only — this is the "show the whole pipeline
# in one button" job for demos and end-to-end smokes. The 4 production
# jobs (producer_events / streaming_events / batch_dimensions /
# gold_aggregations) continue to exist and own their own cadences; this
# orchestrator just inlines their work.
# =============================================================================

resources:
  jobs:
    run_all:
      name: "[${bundle.target}] Run all — end-to-end (flat DAG)"

      email_notifications:
        on_failure:
          - ${var.notifications_email}

      tasks:

        # ============================================================
        # PRODUCER — temporal replay of event CSVs to landing volumes
        # ============================================================
        # Idempotent: replay_olist.py skips work if landing already has
        # batches for every requested table (see `already_replayed`). Pass
        # `--force` to re-replay. First call seeds ~5 min; subsequent calls
        # in `run_all` are sub-minute (just the existence check).
        - task_key: producer_replay
          spark_python_task:
            python_file: ../../src/pipelines/producer/replay_olist.py
            parameters: ["--catalog", "${var.catalog}", "--window-days", "7"]
          environment_key: default

        # ============================================================
        # BRONZE EVENTS — Auto Loader, 4 chains depend on producer
        # ============================================================
        - task_key: bronze_orders
          depends_on: [{ task_key: producer_replay }]
          spark_python_task:
            python_file: ../../src/pipelines/bronze/ingest_events.py
            parameters: ["--catalog", "${var.catalog}", "--table", "orders"]
          environment_key: default

        - task_key: bronze_order_items
          depends_on: [{ task_key: producer_replay }]
          spark_python_task:
            python_file: ../../src/pipelines/bronze/ingest_events.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_items"]
          environment_key: default

        - task_key: bronze_order_payments
          depends_on: [{ task_key: producer_replay }]
          spark_python_task:
            python_file: ../../src/pipelines/bronze/ingest_events.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_payments"]
          environment_key: default

        - task_key: bronze_order_reviews
          depends_on: [{ task_key: producer_replay }]
          spark_python_task:
            python_file: ../../src/pipelines/bronze/ingest_events.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_reviews"]
          environment_key: default

        # ============================================================
        # BRONZE DIMS — COPY INTO, 5 chains, INDEPENDENT of producer
        # (dims read from source/raw/ which is pre-loaded one-shot)
        # ============================================================
        - task_key: bronze_dim_customer
          spark_python_task:
            python_file: ../../src/pipelines/bronze/load_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "customer"]
          environment_key: default

        - task_key: bronze_dim_product
          spark_python_task:
            python_file: ../../src/pipelines/bronze/load_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "product"]
          environment_key: default

        - task_key: bronze_dim_seller
          spark_python_task:
            python_file: ../../src/pipelines/bronze/load_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "seller"]
          environment_key: default

        - task_key: bronze_dim_geolocation
          spark_python_task:
            python_file: ../../src/pipelines/bronze/load_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "geolocation"]
          environment_key: default

        - task_key: bronze_dim_category
          spark_python_task:
            python_file: ../../src/pipelines/bronze/load_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "category"]
          environment_key: default

        # ============================================================
        # SILVER FACTS — MERGE on natural key, quarantine pre-MERGE
        # ============================================================
        - task_key: silver_fact_orders
          depends_on: [{ task_key: bronze_orders }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_fact.py
            parameters: ["--catalog", "${var.catalog}", "--table", "orders"]
          environment_key: default

        - task_key: silver_fact_order_items
          depends_on: [{ task_key: bronze_order_items }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_fact.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_items"]
          environment_key: default

        - task_key: silver_fact_order_payments
          depends_on: [{ task_key: bronze_order_payments }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_fact.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_payments"]
          environment_key: default

        - task_key: silver_fact_order_reviews
          depends_on: [{ task_key: bronze_order_reviews }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_fact.py
            parameters: ["--catalog", "${var.catalog}", "--table", "order_reviews"]
          environment_key: default

        # ============================================================
        # SILVER DIMS — SCD1 MERGE, quarantine pre-MERGE
        # ============================================================
        - task_key: silver_dim_customer
          depends_on: [{ task_key: bronze_dim_customer }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "customer"]
          environment_key: default

        - task_key: silver_dim_product
          depends_on: [{ task_key: bronze_dim_product }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "product"]
          environment_key: default

        - task_key: silver_dim_seller
          depends_on: [{ task_key: bronze_dim_seller }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "seller"]
          environment_key: default

        - task_key: silver_dim_geolocation
          depends_on: [{ task_key: bronze_dim_geolocation }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "geolocation"]
          environment_key: default

        - task_key: silver_dim_category
          depends_on: [{ task_key: bronze_dim_category }]
          spark_python_task:
            python_file: ../../src/pipelines/silver/conform_dim.py
            parameters: ["--catalog", "${var.catalog}", "--table", "category"]
          environment_key: default

        # ============================================================
        # GX GATE (silver facts) — tiered critical/warning, 4 tables
        # ============================================================
        - task_key: gx_validation_orders
          depends_on: [{ task_key: silver_fact_orders }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "fact_orders"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_order_items
          depends_on: [{ task_key: silver_fact_order_items }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "fact_order_items"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_order_payments
          depends_on: [{ task_key: silver_fact_order_payments }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "fact_order_payments"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_order_reviews
          depends_on: [{ task_key: silver_fact_order_reviews }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "fact_order_reviews"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        # ============================================================
        # GX GATE (silver dims) — one task per dim contract
        # ============================================================
        - task_key: gx_validation_dim_customer
          depends_on: [{ task_key: silver_dim_customer }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "dim_customer"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_dim_product
          depends_on: [{ task_key: silver_dim_product }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "dim_product"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_dim_seller
          depends_on: [{ task_key: silver_dim_seller }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "dim_seller"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_dim_geolocation
          depends_on: [{ task_key: silver_dim_geolocation }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "dim_geolocation"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_dim_category
          depends_on: [{ task_key: silver_dim_category }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "silver"
              - "--table"
              - "dim_category"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        # ============================================================
        # GOLD — aggregation depends on validated silver fact_orders
        # AND all 5 validated silver dims.
        # ============================================================
        - task_key: gold_aggregate_revenue
          depends_on:
            - { task_key: gx_validation_orders }
            - { task_key: gx_validation_dim_customer }
            - { task_key: gx_validation_dim_product }
            - { task_key: gx_validation_dim_seller }
            - { task_key: gx_validation_dim_geolocation }
            - { task_key: gx_validation_dim_category }
          spark_python_task:
            python_file: ../../src/pipelines/gold/aggregate_revenue.py
            parameters: ["--catalog", "${var.catalog}"]
          environment_key: default

        # ============================================================
        # GX GATE (gold marts) — one task per mart contract
        # ============================================================
        - task_key: gx_validation_daily_orders
          depends_on: [{ task_key: gold_aggregate_revenue }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "gold"
              - "--table"
              - "daily_orders"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

        - task_key: gx_validation_delivery_performance
          depends_on: [{ task_key: gold_aggregate_revenue }]
          spark_python_task:
            python_file: ../../src/dq/great_expectations/run_checkpoint.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--layer"
              - "gold"
              - "--table"
              - "delivery_performance"
              - "--contracts-dir"
              - "${workspace.file_path}/contracts"
          max_retries: 2
          min_retry_interval_millis: 30000
          environment_key: gx

      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies: []

        - environment_key: gx
          spec:
            client: "2"
            dependencies:
              - great-expectations==1.5.6
