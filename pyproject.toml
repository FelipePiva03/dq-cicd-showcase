[project]
name = "dq-cicd-showcase"
version = "0.1.0"
description = "Streaming Medallion pipeline on Databricks with Data Quality gates (Great Expectations) and CI/CD via DABs."
authors = [{ name = "Felipe Piva", email = "felipepiva02@gmail.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
  "great-expectations==1.5.6",
  "delta-spark==3.2.0",
  "pyyaml>=6.0",  # parses contracts/*.yml in dq.contracts.loader
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "chispa>=0.10.1",
  "ruff==0.6.9",
]
spark = [
  "pyspark==3.5.1",
]

[project.urls]
Repository = "https://github.com/FelipePiva03/dq-cicd-showcase"

# -----------------------------------------------------------------------------
# Ruff: lint + format. Strict but pragmatic.
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]   # tests can monkey-patch

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]   # makes `from src.pipelines... import` work without `pip install -e .`
markers = [
  "integration: requires local Spark session",
]

[tool.coverage.run]
source = ["src"]
